{% extends "core/base.html" %}

{% block page_title %}
IMYR | User
{% endblock %}

{% block header %}
Manager User
{% endblock %}

{% block style %}
{% endblock %}

{% block content %}
<div class="d-flex justify-content-end">
  <button type="button" class="btn btn-primary" id="btnNewUser">
    New user
  </button>
</div>

<div class="mt-3 card">
  <div class="card-header">User list</div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-hover table-borderless align-middle etable" id="tableUser">
        <thead>
        </thead>
        <tbody class="table-group-divider">
        </tbody>
        <caption>
        </caption>
      </table>
    </div>
  </div>
  <div class="card-footer text-muted"></div>
</div>

<!-- Modal -->
<div
  class="modal fade"
  id="modalNewUser"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modalTitleNewUser"
  aria-hidden="true"
>
  <div
    class="modal-dialog modal-md modal-dialog-scrollable modal-dialog-centered"
    role="document"
  >
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitleNewUser">
          New User
        </h5>
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="inputNewUsername">Username</label>
          <input type="text"
            class="form-control"
            id="inputNewUsername"
            placeholder="username"
          >
          <label for="inputNewEmail">Email</label>
          <input type="email"
            class="form-control"
            id="inputNewEmail"
            placeholder="email"
          >
          <label for="inputNewPassword">Password</label>
          <input type="password"
            class="form-control"
            id="inputNewPassword"
            placeholder="password"
          >
          <input type="password"
            class="form-control"
            id="inputNewRePassword"
            placeholder="re-enter password"
          >
          <div id="blockInputRole">
            <label for="inputNewRole">Role</label>
            <select class="form-control" id="inputNewRole">
              <option value="admin">admin</option>
              <option value="manager">manager</option>
              <option value="operator">operator</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          data-dismiss="modal"
        >
          Close
        </button>
        <button type="button" class="btn btn-primary" id="btnSubmitNewUser">Submit</button>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  id="modalUpdateInfoUser"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modalTitleUpdateInfoUser"
  aria-hidden="true"
>
  <div
    class="modal-dialog modal-md modal-dialog-scrollable modal-dialog-centered"
    role="document"
  >
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitleUpdateInfoUser">
          Update info
        </h5>
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="inputUpdatePassword">New password</label>
          <input type="password"
            class="form-control"
            id="inputUpdatePassword"
            placeholder="password"
          >

          <input type="password"
            class="form-control"
            id="inputUpdateRePassword"
            placeholder="re-enter password"
          >
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          data-dismiss="modal"
        >
          Close
        </button>
        <button type="button" class="btn btn-primary" id="btnSubmitUpdateInfoUser">Submit</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const IMYR = window.IMYR
  const tableDOM = document.getElementById('tableUser')

  if (IMYR.user.role !== 'admin') {
    document.getElementById('blockInputRole').classList.add('d-none')
  }

  /** 
   * USETS TABLE
   * */

  const sortField = ['username', 'email', 'role']

  const colsConfig = [
    {
      label: 'Username',
      sortField: 'username',
      render: (data) => {
        return data.username
      },
    },
    {
      label: 'Email',
      sortField: 'email',
      render: (data) => {
        return data.email
      },
    },
    {
      label: 'Role',
      sortField: 'role',
      render: (data) => {
        return data.role
      },
    },
    {
      label: 'Status',
      render: (data) => {
        return `
        <input type="checkbox"
          ${ data.status === 'active' ? 'checked' : ''}
          data-action="change_status"
          data-info="${data.id}"
          data-toggle="switchbutton"
          data-on="Active"
          data-off="Inactive"
          data-onstyle="success"
          data-offstyle="secondary"
        >`
      }
    },
    {
      label: 'Action',
      render: (data) => {
        return `
        <div class="btn-group" role="group">
          <button type="button"
            class="btn btn-warning"
            data-action="update_info"
            data-info="${data.id}"
          >
            update
          </button>
        </div>`
      },
    },
  ]

  const eTable = IMYR.eTable(tableDOM, {
    cols: colsConfig,
    limit: 10,
    sortDir: 'asc',
    fetchData: ({ limit, offset, sortCol, sortDir, sortField }) => {
      return IMYR.request(
        'get_users',
        {
          offset, limit,
          sortCol, sortDir, sortField,
        },
      ).then((data) => {
        if (data.status === 200) {
          return data.data
        }

        Swal.fire({ icon: 'error', text: data.message || data.error || data })

        return { total: 0, data: [] }
      })
    },
    onPostRender: () => {
      $(function() {
        document.querySelectorAll(
          'input[type=checkbox][data-toggle="switchbutton"]'
        ).forEach(function(ele) {
          ele.switchButton();
        })
      })
    },
  })

  tableDOM.addEventListener('change', (e) => {
    if (e.target.dataset.action === 'change_status') {
      onUpdateStatus(e)
    }
  })

  tableDOM.addEventListener('click', (e) => {
    if (e.target.dataset.action === 'update_info') {
      onUpdateInfo(e)
    }
  })

  /**
   * NEW USER
   * */
  const newUserDOMs = {
    modal: new bootstrap.Modal(document.getElementById('modalNewUser')),
    username: document.getElementById('inputNewUsername'),
    email: document.getElementById('inputNewEmail'),
    password: document.getElementById('inputNewPassword'),
    rePassword: document.getElementById('inputNewRePassword'),
    role: document.getElementById('inputNewRole'),
    open: document.getElementById('btnNewUser'),
    submit: document.getElementById('btnSubmitNewUser'),
  }

  newUserDOMs.open.addEventListener('click', () => {
    Object.values(newUserDOMs).forEach((inputDOM) => {
      inputDOM.value = ''
    })

    newUserDOMs.modal.show()
  })

  newUserDOMs.submit.addEventListener('click', () => {
    const data = {
      username: newUserDOMs.username.value.trim(),
      email: newUserDOMs.email.value.trim(),
      password: newUserDOMs.password.value.trim(),
      role: newUserDOMs.role.value.trim(),
    }

    const rePassword = newUserDOMs.rePassword.value.trim()

    if (IMYR.user.role !== 'admin' && IMYR.user.role !== 'manager') {
      Swal.fire({ icon: 'error', text: 'You do not have permission to do this action!' })
      return
    }
    
    if (IMYR.user.role !== 'admin' || !data.role) {
      data.role = 'operator'
    }

    if (!data.username || !data.email || !data.password || !rePassword) {
      Swal.fire({ icon: 'error', text: 'Phease fill username, email, password and re-enter password' })
      return
    }

    if (data.password !== rePassword) {
      Swal.fire({ icon: 'error', text: 'Password and re-enter password not match' })
      return
    }

    if (!IMYR.validateEmail(data.email)) {
      Swal.fire({ icon: 'error', text: 'Email is invalid' })
      return
    }

    IMYR.request('post_new_user', data).then((resData) => {
      if (resData.status !== 200) {
        Swal.fire({ icon: 'error', text: resData.message || resData.error })
        return
      }

      Swal.fire({ icon: 'success', text: 'New user added' }).then(() => {
        eTable.requestRender()
        newUserDOMs.modal.hide()
      })
    })
  })

  /** 
   * UPDATE STATUS
   * */

  const onUpdateStatus = (e) => {
    const user_id = e.target.dataset.info
    const status = e.target.checked ? 'active' : 'inactive'

    e.target.switchButton(e.target.checked ? 'off' : 'on', true)

    IMYR.request(
      'update_status',
      {
        user: user_id,
        status,
      },
    ).then((data) => {
      if (data.status !== 200) {
        Swal.fire({ icon: 'error', text: data.message || data.error })
        return
      }

      Swal.fire({ icon: 'success', text: `Success set user ${status}` })
      e.target.switchButton(status === 'active' ? 'on' : 'off', true)
    })
  }

  /**
   * UPDATE PASSWORD
   * */

  const updateInfoData = {
    selected: null,
  }

  const updateInfoDOMs = {
    modal: new bootstrap.Modal(document.getElementById('modalUpdateInfoUser')),
    modalTitle: document.getElementById('modalTitleUpdateInfoUser'),
    password: document.getElementById('inputUpdatePassword'),
    rePassword: document.getElementById('inputUpdateRePassword'),
    submit: document.getElementById('btnSubmitUpdateInfoUser'),
  }

  const onUpdateInfo = (e) => {
    updateInfoData.selected = eTable.tData.data.find(({ id }) => id === parseInt(e.target.dataset.info))

    if (!updateInfoData.selected) {
      return
    }

    updateInfoDOMs.modal.show()
    updateInfoDOMs.modalTitle.innerHTML = `Update <b>${updateInfoData.selected.username}</b>`
    updateInfoDOMs.password.value = ''
    updateInfoDOMs.rePassword.value = ''
  }

  updateInfoDOMs.submit.addEventListener('click', () => {
    if (!updateInfoData.selected) {
      return
    }

    const data = {
      password: updateInfoDOMs.password.value.trim(),
    }

    const rePassword = updateInfoDOMs.rePassword.value.trim()

    if (!Object.values(data).some((v) => !!v)) {
      Swal.fire({ icon: 'error', text: 'Nothing to update' })
      return
    }

    if (data.password && data.password !== rePassword) {
      Swal.fire({ icon: 'error', text: 'Password and re-enter password not match' })
      return
    }

    IMYR.request(
      'update_info',
      {
        user: updateInfoData.selected.id,
        ...data,
      },
    ).then((data) => {
      if (data.status !== 200) {
        Swal.fire({ icon: 'error', text: data.message || data.error })
        return
      }

      eTable.requestRender()
      Swal.fire({ icon: 'success', text: `Success update user ${updateInfoData.selected.username}` }).then(() => {
        updateInfoDOMs.modal.hide()
      })
    })
  })

})
</script>
{% endblock %}
